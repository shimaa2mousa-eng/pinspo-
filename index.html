<!DOCTYPE html>
<html>
<head>
  <!-- Phones (700px wide or less) get the phone version -->
  <script>if (matchMedia('(max-width: 700px)').matches) location.replace('phone.html' + location.hash);</script>
  <title>Pinspo</title>
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Caveat:wght@600&family=Dancing+Script:wght@600&family=Patrick+Hand&family=Permanent+Marker&family=Playfair+Display:wght@600&family=Special+Elite&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pinspo</title>
<meta name="description" content="A cozy drag-and-drop mood board.">
<link rel="icon" type="image/png" href="images/favicon.png">
</head>
<body>
  <div id="intro"><img src="images/logo.png" alt="Pinspo"></div>
  <div id="stage">
    <div id="layersBox">
  <div class="lhead"><b>Edit Board</b><button id="layersClose">×</button></div>
  <p class="lsub">Board Layers</p>
  <div id="layerList"></div>
  <button id="clearBoard">Clear entire board</button>
</div>
    <div id="board"></div>
    <img class="shelf" id="butterfly" data-type="sticker" draggable="false" src="images/butterfly.png">
    <img class="shelf" id="flower" data-type="sticker" draggable="false" src="images/flower.png">
    <img class="shelf" id="pin" data-type="sticker" draggable="false" src="images/pin.png">
    <img class="shelf" id="candel" data-type="sticker" draggable="false" src="images/candel.png">
   <img class="shelf" id="shelfcalendar" data-type="sticker" draggable="false" src="images/peek/peek-01.png">
    <img class="shelf" id="poloroid" data-type="sticker" draggable="false" src="images/poloroid.png">
    <img class="shelf" id="plant" data-type="sticker" draggable="false" src="images/plant/plant-01.png">
    <img class="shelf" id="books" data-type="sticker" draggable="false" src="images/books.png">
    <img class="shelf" id="penciljar" data-type="sticker" draggable="false" src="images/jar/jar-01.png">
    <img class="shelf" id="stickynote" data-type="sticker" draggable="false" src="images/note/note-01.png">
    <img class="shelf" id="vase" data-type="sticker" draggable="false" src="images/vase.png">
    <img class="shelf" id="upload" data-type="sticker" draggable="false" src="images/upload.png">
    <img class="shelf" id="saveto" data-type="sticker" draggable="false" src="images/saveto.png">
    <img class="shelf" id="goldpin" data-type="sticker" draggable="false" src="images/goldpin.png">
    <img id="logo" draggable="false" src="images/logo.png">
    <div id="flame"></div>
    <div id="panel">
  <div class="ticket">
    <div class="tmain">
      <label>Font</label>
      <select id="fontSelect">
        <option style="font-family:Caveat">Caveat</option>
        <option style="font-family:'Patrick Hand'">Patrick Hand</option>
        <option style="font-family:'Amatic SC'">Amatic SC</option>
        <option style="font-family:'Special Elite'">Special Elite</option>
        <option style="font-family:'Playfair Display'">Playfair Display</option>
        <option style="font-family:'Dancing Script'">Dancing Script</option>
        <option style="font-family:'Permanent Marker'">Permanent Marker</option>
      </select>
      <textarea id="panelText" placeholder="Type your text..."></textarea>
      <button id="addText">Add to board</button>
    </div>
    <div class="tstub">
      <label>Color</label>
      <div id="swatches"></div>
      <button id="panelClose" type="button">✕</button>
    </div>
  </div>
</div>
  <script src="script.js"></script>
</body>
</html>
